AWSTemplateFormatVersion: 2010-09-09
Description: Batch job definition for HCM bottom-line meta-analysis (reuses the SGC QC compute env / queue)

# Clone of sgc_ma/sgc_gwas_ma.yml for the HCM tenant. Adds only an ECR repo + a
# Batch job definition + its job role + a log group. It deliberately does NOT
# create a compute environment or queue: HCM MA jobs are submitted onto the
# existing SGC QC queue (sgc-gwas-qc-plots-queue) by hcm_ma/submit_ma_batch.py.
# The job definition is env-agnostic; the submitter injects DATA_REGISTRY_DB_NAME
# per job via containerOverrides (QA vs prod).
#
# Deploy: aws cloudformation deploy --template-file hcm_ma/hcm_gwas_ma.yml \
#           --stack-name hcm-gwas-ma --capabilities CAPABILITY_IAM --region us-east-1

Resources:
  MaEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: hcm-gwas-ma-repo

  MaJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ['ecs-tasks.amazonaws.com']
            Action: ['sts:AssumeRole']
      Path: '/'
      Policies:
        - PolicyName: 'RegistryS3Access'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource:
                  - 'arn:aws:s3:::dig-data-registry'
                  - 'arn:aws:s3:::dig-data-registry/*'
                  - 'arn:aws:s3:::dig-data-registry-qa'
                  - 'arn:aws:s3:::dig-data-registry-qa/*'
        # Secrets Manager appends a 6-char random suffix to every secret ARN,
        # so the trailing wildcard is required to address the named secret.
        - PolicyName: 'SecretsRead'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['secretsmanager:GetSecretValue']
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:data-registry*'
        - PolicyName: 'ECRAndLogs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchGetImage'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: '*'

  MaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/batch/hcm-gwas-ma
      RetentionInDays: 30

  MaJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: 'container'
      JobDefinitionName: 'hcm-gwas-ma-job'
      PlatformCapabilities: ['FARGATE']
      Timeout:
        AttemptDurationSeconds: 7200
      ContainerProperties:
        Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/hcm-gwas-ma-repo'
        # Image ENTRYPOINT is ["python", "-m", "hcm_ma.run_ma"];
        # the values below are appended as CLI args by the submitter. The MA
        # worker looks the run up by id and reads the file selection + thresholds
        # off the run row itself, so it needs only run-id + bucket.
        Command:
          - '--run-id'
          - 'Ref::run-id'
          - '--bucket'
          - 'Ref::bucket'
        JobRoleArn: !GetAtt MaJobRole.Arn
        ExecutionRoleArn: !GetAtt MaJobRole.Arn
        ResourceRequirements:
          - Type: 'VCPU'
            Value: '2'
          - Type: 'MEMORY'
            Value: '16384'
        # The worker disk-sorts the per-cohort files (several GB total) plus GNU
        # sort's own temp in TMPDIR, so the 20 GiB Fargate default is too tight.
        EphemeralStorage:
          SizeInGiB: 50
        NetworkConfiguration:
          AssignPublicIp: 'ENABLED'
        FargatePlatformConfiguration:
          PlatformVersion: 'LATEST'
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: /aws/batch/hcm-gwas-ma
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: ma
        Environment:
          - Name: AWS_DEFAULT_REGION
            Value: us-east-1
          # DATA_REGISTRY_DB_NAME is injected per-job by hcm_ma/submit_ma_batch.py
          # via containerOverrides.environment (QA vs prod).
