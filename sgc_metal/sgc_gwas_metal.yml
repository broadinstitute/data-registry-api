AWSTemplateFormatVersion: 2010-09-09
Description: Batch job definition for the SGC METAL meta-analysis worker (reuses the QC compute env / queue)

# This stack adds only an ECR repo + a Batch job definition + its job role.
# It deliberately does NOT create a compute environment or queue: METAL jobs are
# submitted onto the existing QC queue (sgc-gwas-qc-plots-queue) by
# submit_ma_batch.py. The job definition is env-agnostic; the submitter injects
# DATA_REGISTRY_DB_NAME per job via containerOverrides (QA vs prod).

Resources:
  MetalEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: sgc-gwas-metal-repo

  MetalJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ['ecs-tasks.amazonaws.com']
            Action: ['sts:AssumeRole']
      Path: '/'
      Policies:
        - PolicyName: 'RegistryS3Access'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource:
                  - 'arn:aws:s3:::dig-data-registry'
                  - 'arn:aws:s3:::dig-data-registry/*'
                  - 'arn:aws:s3:::dig-data-registry-qa'
                  - 'arn:aws:s3:::dig-data-registry-qa/*'
        # Secrets Manager appends a 6-char random suffix to every secret ARN,
        # so the trailing wildcard is required to address the named secret.
        - PolicyName: 'SecretsRead'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['secretsmanager:GetSecretValue']
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:data-registry*'
        - PolicyName: 'ECRAndLogs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchGetImage'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: '*'

  MetalLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/batch/sgc-gwas-metal
      RetentionInDays: 30

  MetalJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: 'container'
      JobDefinitionName: 'sgc-gwas-metal-job'
      PlatformCapabilities: ['FARGATE']
      # METAL 2020-05-05 reads ~12 us per input line in the main pass (ANALYZE HETEROGENEITY
      # reads every input twice) and ~7 us per line in the frequency pass (a second, plain
      # ANALYZE over the EAF cohorts when only some report EAF). A 22-cohort x 12M-row bucket
      # is ~55 min + ~25 min of METAL, plus downloads, the sort/merge join, gzip and plots.
      Timeout:
        AttemptDurationSeconds: 21600
      # MA jobs run on FARGATE_SPOT (see the QC-plots queue they share), so a
      # reclaimed job would otherwise land as FAILED with no retry and need
      # resubmitting by hand. Retry any failure rather than filtering on the Spot
      # status reason: a pattern that failed to match would silently disable
      # retries altogether, and re-running a genuinely broken MA costs one more
      # attempt of Fargate time. The worker writes to a deterministic run_id prefix,
      # so a second attempt overwrites the first attempt's artifacts.
      RetryStrategy:
        Attempts: 2
      ContainerProperties:
        Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sgc-gwas-metal-repo'
        # Image ENTRYPOINT is ["python", "-m", "sgc_metal.run_metal"];
        # the values below are appended as CLI args by the submitter. The MA
        # worker looks the run up by id and reads phenotype/ancestry/selection/
        # thresholds off the run row itself, so it needs only run-id + bucket.
        Command:
          - '--run-id'
          - 'Ref::run-id'
          - '--bucket'
          - 'Ref::bucket'
        JobRoleArn: !GetAtt MetalJobRole.Arn
        ExecutionRoleArn: !GetAtt MetalJobRole.Arn
        ResourceRequirements:
          - Type: 'VCPU'
            Value: '4'
          # METAL holds every distinct marker in memory, ~550 B each (measured), so
          # 30 GiB (the 4-vCPU Fargate maximum) fits ~45M markers with room for the
          # worker's own streaming summary; 16 GiB capped out near 28M markers.
          - Type: 'MEMORY'
            Value: '30720'
        # Disk: the gzipped inputs (deleted after the last METAL pass reading them),
        # METAL's .tbl (~100 B per marker) for each pass, both sorted copies and the
        # joined table during the frequency join, plus the gzipped outputs: ~35-45 GB
        # for the largest two-pass buckets.
        EphemeralStorage:
          SizeInGiB: 100
        NetworkConfiguration:
          AssignPublicIp: 'ENABLED'
        FargatePlatformConfiguration:
          PlatformVersion: 'LATEST'
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: /aws/batch/sgc-gwas-metal
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: metal
        Environment:
          - Name: AWS_DEFAULT_REGION
            Value: us-east-1
          # DATA_REGISTRY_DB_NAME is injected per-job by submit_ma_batch.py
          # via containerOverrides.environment (QA vs prod).
