AWSTemplateFormatVersion: 2010-09-09
Description: Batch job definition for the SGC munge stage (reuses the QC compute env / queue)

# This stack adds only an ECR repo + a Batch job definition + its job role.
# It deliberately does NOT create a compute environment or queue: munge jobs are
# submitted onto the existing QC queue (sgc-gwas-qc-plots-queue) by
# submit_munge_batch.py. The job definition is env-agnostic; the submitter injects
# DATA_REGISTRY_DB_NAME per job via containerOverrides (QA vs prod).

Resources:
  MungeEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: sgc-gwas-munge-repo

  MungeJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ['ecs-tasks.amazonaws.com']
            Action: ['sts:AssumeRole']
      Path: '/'
      Policies:
        - PolicyName: 'RegistryS3Access'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource:
                  - 'arn:aws:s3:::dig-data-registry'
                  - 'arn:aws:s3:::dig-data-registry/*'
                  - 'arn:aws:s3:::dig-data-registry-qa'
                  - 'arn:aws:s3:::dig-data-registry-qa/*'
        # Secrets Manager appends a 6-char random suffix to every secret ARN,
        # so the trailing wildcard is required to address the named secret.
        - PolicyName: 'SecretsRead'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['secretsmanager:GetSecretValue']
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:data-registry*'
        - PolicyName: 'ECRAndLogs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchGetImage'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: '*'

  MungeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/batch/sgc-gwas-munge
      RetentionInDays: 30

  MungeJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: 'container'
      JobDefinitionName: 'sgc-gwas-munge-job'
      PlatformCapabilities: ['FARGATE']
      Timeout:
        AttemptDurationSeconds: 28800
      # Munge jobs run on FARGATE_SPOT (see the QC-plots queue they share), so a
      # reclaimed job would otherwise land as FAILED with no retry. Retry any
      # failure; the worker writes to a deterministic per-file prefix, so a
      # second attempt overwrites the first attempt's artifacts.
      RetryStrategy:
        Attempts: 2
      ContainerProperties:
        Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sgc-gwas-munge-repo'
        # Image ENTRYPOINT is ["python", "-m", "sgc_munge.munge"];
        # the values below are appended as CLI args by the submitter.
        Command:
          - '--s3-path'
          - 'Ref::s3-path'
          - '--column-mapping'
          - 'Ref::column-mapping'
          - '--bucket'
          - 'Ref::bucket'
          - '--file-id'
          - 'Ref::file-id'
          - '--output-prefix'
          - 'Ref::output-prefix'
          - '--ref-prefix'
          - 'Ref::ref-prefix'
          - '--cases'
          - 'Ref::cases'
          - '--controls'
          - 'Ref::controls'
        JobRoleArn: !GetAtt MungeJobRole.Arn
        ExecutionRoleArn: !GetAtt MungeJobRole.Arn
        ResourceRequirements:
          - Type: 'VCPU'
            Value: '2'
          - Type: 'MEMORY'
            Value: '8192'
        EphemeralStorage:
          SizeInGiB: 40
        NetworkConfiguration:
          AssignPublicIp: 'ENABLED'
        FargatePlatformConfiguration:
          PlatformVersion: 'LATEST'
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: /aws/batch/sgc-gwas-munge
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: munge
        Environment:
          - Name: AWS_DEFAULT_REGION
            Value: us-east-1
          # DATA_REGISTRY_DB_NAME is injected per-job by submit_munge_batch.py
          # via containerOverrides.environment (QA vs prod).
